# 联邦学习+交叉信用风险 学习笔记
site_name: 联邦学习与信用风险研究笔记
site_description: 科研学习记录
theme:
  name: material  # 专业主题
  language: zh    # 中文界面
  features:
    - search      # 开启内置搜索（核心！）
# 支持公式、代码高亮、目录
markdown_extensions:
  - pymdownx.highlight
  - pymdownx.superfences
  - toc
  - pymdownx.arithmatex  # 支持LaTeX公式（写信用风险模型必备）